<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-Books</title>
<style>
:root{--bg:#f4f1ea;--brown:#382110;--link:#00635d;--green:#409d69;--line:#d8d8d8;--mute:#767676}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--brown);font:15px/1.55 Lato,"Helvetica Neue",Helvetica,Arial,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,.logo{font-family:Georgia,"Times New Roman",serif}
header{background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:auto;padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{font-size:30px;font-weight:700;color:var(--brown);letter-spacing:-.5px}.logo:hover{text-decoration:none}
#sf{flex:1;display:flex;min-width:220px}
#sf input{flex:1;padding:8px 10px;border:1px solid #bbb;border-right:0;border-radius:3px 0 0 3px;font:inherit;background:#fff}
#sf button{border:1px solid #bbb;background:#e9e5d8;color:var(--brown);padding:0 14px;border-radius:0 3px 3px 0;cursor:pointer;font:inherit}
nav{display:flex;gap:14px;align-items:center}nav a,nav button{font:inherit;background:none;border:0;color:var(--link);cursor:pointer;padding:0}
main{max-width:1000px;margin:20px auto;padding:0 16px;min-height:60vh}
.box{background:#fff;border:1px solid var(--line);border-radius:3px;padding:20px 24px}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);margin-bottom:18px;padding-bottom:8px}
h1,h2{margin:0;font-weight:700}h2{font-size:22px}h1{font-size:30px}
select,input,textarea{font:inherit;color:var(--brown)}
select{padding:5px;border:1px solid #bbb;border-radius:3px;background:#fff;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px 18px}
.card{display:flex;flex-direction:column;color:var(--brown);gap:2px}.card:hover{text-decoration:none}.card b{font-family:Georgia,serif;margin-top:6px;line-height:1.25}.card:hover b{color:var(--link);text-decoration:underline}
.card small{color:var(--mute)}
.cv{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:2px 5px 5px 2px;box-shadow:2px 2px 6px rgba(0,0,0,.28),inset 4px 0 4px -2px rgba(0,0,0,.25)}
.ph{display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;color:#fff;font-family:Georgia,serif;overflow:hidden}
.ph span{font-size:16px;font-weight:700;line-height:1.2}.ph i{font-size:12px;opacity:.85}
.btn{display:inline-block;background:var(--green);color:#fff;border:1px solid #2f7d51;border-radius:4px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer;text-align:center}
.btn:hover{background:#368a5c;text-decoration:none}.btn.alt{background:#f4f1ea;color:var(--brown);border-color:#bbb;font-weight:400}.btn.red{background:#fff;color:#a22;border-color:#c99}
.book{display:grid;grid-template-columns:220px 1fr;gap:30px}
.book .cv{margin-bottom:14px}.book .btn{width:100%}
.meta{color:var(--mute);margin:2px 0}.desc{white-space:pre-wrap;margin:16px 0;font-family:Georgia,serif;font-size:16px;line-height:1.65}
.tag{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 10px;margin:0 6px 6px 0;background:#faf8f3}
form.f{max-width:620px}form.f label{display:block;margin:12px 0 4px;font-weight:700}
form.f input[type=text],form.f input[type=password],form.f input[type=number],form.f select,form.f textarea{width:100%;padding:8px;border:1px solid #bbb;border-radius:3px;background:#fff;margin:0}
form.f textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{color:var(--mute);font-weight:400;font-size:13px}.chk{display:flex;gap:8px;align-items:flex-start;margin:16px 0;font-weight:400!important}
.err{color:#a22;margin:10px 0}.pg{display:flex;justify-content:center;gap:20px;margin-top:26px}
footer{max-width:1000px;margin:30px auto;padding:0 16px;color:var(--mute);font-size:13px;text-align:center}
@media(max-width:640px){.book{grid-template-columns:1fr}.book .cv{max-width:200px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/">A-Books</a>
  <form id="sf"><input id="q" type="search" placeholder="Search by title, author, genre or tag"><button>Search</button></form>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<footer>A-Books is a community library. Only share books you have the right to share.</footer>

<script>
const $ = s => document.querySelector(s), app = $('#app');
const GENRES = ['Fiction','Non-fiction','Fantasy','Science fiction','Mystery & thriller','Romance','Horror','Historical','Biography','Self-help','Science','Technology','Business','Philosophy','Religion','Poetry','Children','Comics','Education','Other'];
let me = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u, o) { const r = await fetch(u, o); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; }
const post = (u, b) => api(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
const fsize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';
const cover = b => b.cover ? `<img class="cv" src="/covers/${esc(b.cover)}" alt="Cover of ${esc(b.title)}">`
  : `<div class="cv ph" style="background:hsl(${[...b.title].reduce((a, c) => a + c.charCodeAt(0), 0) % 360} 32% 36%)"><span>${esc(b.title)}</span><i>${esc(b.author)}</i></div>`;
const card = b => `<a class="card" href="#/book/${b.id}">${cover(b)}<b>${esc(b.title)}</b><small>by ${esc(b.author)}</small><small>${b.format.toUpperCase()} · ${b.downloads} downloads</small></a>`;
const opts = (list, sel, blank) => (blank ? `<option value="">${blank}</option>` : '') + list.map(g => `<option ${g === sel ? 'selected' : ''}>${esc(g)}</option>`).join('');

function renderNav() {
  $('#nav').innerHTML = me
    ? `<a href="#/upload">Upload a book</a><span>${esc(me.username)}</span><button id="out">Sign out</button>`
    : `<a href="#/login">Sign in</a><a class="btn" href="#/register" style="padding:4px 12px">Join</a>`;
  if (me) $('#out').onclick = async () => { await post('/api/logout'); me = null; location.hash = '#/'; route(); };
}

async function browse(_, p) {
  const q = p.get('q') || '', genre = p.get('genre') || '', sort = p.get('sort') || 'new', page = +p.get('page') || 1;
  $('#q').value = q;
  const go = o => { const n = new URLSearchParams({ q, genre, sort, page: 1, ...o }); [...n].forEach(([k, v]) => (!v || (k === 'page' && v == 1) || (k === 'sort' && v === 'new')) && n.delete(k)); location.hash = '#/?' + n; };
  const d = await api('/api/books?' + new URLSearchParams({ q, genre, sort, page }));
  const title = q ? `${d.total} result${d.total === 1 ? '' : 's'} for “${esc(q)}”` : genre ? esc(genre) : 'Recently published';
  app.innerHTML = `<div class="box"><div class="hd"><h2>${title}</h2><div>
    <select id="gs">${opts(GENRES, genre, 'All genres')}</select>
    <select id="ss"><option value="new">Newest</option><option value="popular" ${sort === 'popular' ? 'selected' : ''}>Most downloaded</option><option value="title" ${sort === 'title' ? 'selected' : ''}>Title A–Z</option></select></div></div>
    ${d.books.length ? `<div class="grid">${d.books.map(card).join('')}</div>`
      : `<p>No books found. ${me ? '<a href="#/upload">Upload the first one.</a>' : '<a href="#/register">Join and upload the first one.</a>'}</p>`}
    ${d.pages > 1 ? `<div class="pg">${page > 1 ? '<a href="#" id="pv">‹ Previous</a>' : ''}<span>Page ${page} of ${d.pages}</span>${page < d.pages ? '<a href="#" id="nx">Next ›</a>' : ''}</div>` : ''}</div>`;
  $('#gs').onchange = e => go({ genre: e.target.value });
  $('#ss').onchange = e => go({ sort: e.target.value });
  if ($('#pv')) $('#pv').onclick = e => { e.preventDefault(); go({ page: page - 1 }); };
  if ($('#nx')) $('#nx').onclick = e => { e.preventDefault(); go({ page: page + 1 }); };
}

async function book(id) {
  const b = await api('/api/books/' + id);
  const tags = (b.tags || '').split(',').map(t => t.trim()).filter(Boolean);
  const can = me && (me.is_admin || me.id === b.user_id);
  app.innerHTML = `<div class="box book"><div>${cover(b)}
      <a class="btn" href="/api/books/${b.id}/download">Download ${b.format.toUpperCase()} (${fsize(b.size)})</a>
      ${can ? '<p><button class="btn red" id="del" style="width:100%">Delete this book</button></p>' : ''}</div>
    <div><h1>${esc(b.title)}</h1><div style="font-size:18px;margin:4px 0 12px">by ${esc(b.author)}</div>
      <div class="meta">${[b.genre && `Genre: <a href="#/?genre=${encodeURIComponent(b.genre)}">${esc(b.genre)}</a>`, b.year && `Published ${b.year}`, b.language && esc(b.language)].filter(Boolean).join(' · ')}</div>
      <div class="meta">${b.downloads} downloads · uploaded by ${esc(b.uploader)} on ${new Date(b.created + 'Z').toLocaleDateString()}</div>
      ${b.description ? `<div class="desc">${esc(b.description)}</div>` : '<div style="height:14px"></div>'}
      ${tags.map(t => `<a class="tag" href="#/?q=${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}</div></div>`;
  if (can) $('#del').onclick = async () => { if (confirm('Delete this book permanently?')) { await api('/api/books/' + b.id, { method: 'DELETE' }); location.hash = '#/'; } };
}

function upload() {
  if (!me) { location.hash = '#/login'; return; }
  app.innerHTML = `<div class="box"><div class="hd"><h2>Upload a book</h2></div>
  <form class="f" id="uf">
    <label>Title *</label><input type="text" name="title" required maxlength="200">
    <label>Author *</label><input type="text" name="author" required maxlength="200">
    <div class="row"><div><label>Genre</label><select name="genre">${opts(GENRES, '', 'Choose…')}</select></div>
      <div><label>Year</label><input type="number" name="year" min="0" max="2100"></div>
      <div><label>Language</label><input type="text" name="language" placeholder="English"></div></div>
    <label>Description</label><textarea name="description" maxlength="5000"></textarea>
    <label>Tags <span class="hint">comma separated</span></label><input type="text" name="tags" placeholder="classic, adventure">
    <label>Book file * <span class="hint">PDF, EPUB or DJVU, up to 300 MB</span></label><input type="file" name="book" accept=".pdf,.epub,.djvu,.djv" required>
    <label>Cover image <span class="hint">optional, JPG, PNG or WEBP</span></label><input type="file" name="cover" accept=".jpg,.jpeg,.png,.webp">
    <label class="chk"><input type="checkbox" name="rights"> <span>I own this file or have the right to share it.</span></label>
    <div class="err" id="e"></div><button class="btn" id="sb">Publish book</button></form></div>`;
  $('#uf').onsubmit = async e => {
    e.preventDefault(); $('#e').textContent = ''; $('#sb').disabled = true; $('#sb').textContent = 'Publishing…';
    try { const r = await api('/api/books', { method: 'POST', body: new FormData(e.target) }); location.hash = '#/book/' + r.id; }
    catch (x) { $('#e').textContent = x.message; $('#sb').disabled = false; $('#sb').textContent = 'Publish book'; }
  };
}

const auth = mode => () => {
  const reg = mode === 'register';
  app.innerHTML = `<div class="box" style="max-width:420px;margin:auto"><div class="hd"><h2>${reg ? 'Create your account' : 'Sign in to A-Books'}</h2></div>
  <form class="f" id="af"><label>Username</label><input type="text" name="username" required autocomplete="username">
    <label>Password</label><input type="password" name="password" required autocomplete="${reg ? 'new' : 'current'}-password">
    <div class="err" id="e"></div><button class="btn">${reg ? 'Create account' : 'Sign in'}</button>
    <p>${reg ? 'Already a member? <a href="#/login">Sign in</a>' : 'New here? <a href="#/register">Create an account</a>'}</p></form></div>`;
  $('#af').onsubmit = async e => {
    e.preventDefault();
    try { me = await post('/api/' + mode, Object.fromEntries(new FormData(e.target))); location.hash = '#/'; route(); }
    catch (x) { $('#e').textContent = x.message; }
  };
};

const R = { '': browse, book, upload, login: auth('login'), register: auth('register') };
async function route() {
  const [path, qs] = location.hash.slice(2).split('?'), [name, id] = path.split('/');
  renderNav();
  try { await (R[name] || browse)(id, new URLSearchParams(qs || '')); }
  catch (e) { app.innerHTML = `<div class="box"><p class="err">${esc(e.message)}</p><a href="#/">Back to browsing</a></div>`; }
  window.scrollTo(0, 0);
}
$('#sf').onsubmit = e => { e.preventDefault(); location.hash = '#/?q=' + encodeURIComponent($('#q').value.trim()); };
window.addEventListener('hashchange', route);
api('/api/me').then(d => { me = d.user; route(); });
</script>
</body>
</html>
